<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>O encontro de duas Luas 🌙</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

  <div class="moons">

  <div class="moon moon-left">
    🌙
  </div>

  <div class="moon moon-right">
    🌙
  </div>

</div>

  <p class="eyebrow">
    PRÓXIMO ENCONTRO
  </p>

  <h1>
    Até nos vermos novamente ❤️
  </h1>

  <p class="message">
    Cada segundo deixa o mundo um pouquinho mais perto de admirar esse fenômeno: o encontro de duas Luas.
  </p>

  <section class="countdown">

    <div class="time-box">
      <span id="days">00</span>
      <p>Dias</p>
    </div>

    <div class="time-box">
      <span id="hours">00</span>
      <p>Horas</p>
    </div>

    <div class="time-box">
      <span id="minutes">00</span>
      <p>Minutos</p>
    </div>

    <div class="time-box">
      <span id="seconds">00</span>
      <p>Segundos</p>
    </div>

  </section>

  <div class="meeting-info">

    <p>📅 Nosso próximo encontro será:</p>

    <strong id="meeting-date">
      Em breve ❤️
    </strong>

  </div>

<section class="upcoming-eclipses">

  <h4>
    Próximos eclipses 🌙
  </h4>

  <div id="eclipse-list"></div>

</section>
  
</main>

  <script src="script.js"></script>

</body>
</html>
